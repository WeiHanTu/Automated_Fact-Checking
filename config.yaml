# Fact-checking BERT Configuration
# CSE 256 Natural Language Processing Project

# Model Configuration
model:
  name: "bert-base-uncased"
  max_length: 512
  num_labels: 3
  dropout_rate: 0.2

# Training Configuration
training:
  learning_rate: 5e-5
  batch_size: 12
  num_epochs: 15
  warmup_steps: 500
  weight_decay: 0.01
  gradient_accumulation_steps: 3
  early_stopping_patience: 3

# Optimizer Configuration
optimizer:
  name: "ClippyAdagrad"
  layer_learning_rates:
    encoder_layers_0_5: 1e-5
    encoder_layers_6_11: 2e-5
    pooler: 2e-5
    classifier: 3e-5

# Data Configuration
data:
  train_file: "data/raw/train.csv"
  valid_file: "data/raw/valid.csv"
  test_file: "data/raw/test.csv"
  text_column: "text"
  claim_column: "claim"
  label_column: "label"

# Experiment Configuration
experiment:
  output_dir: "src/experiments"
  logging_steps: 500
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  metric_for_best_model: "eval_f1"
  greater_is_better: true
  save_total_limit: 6

# Logging Configuration
logging:
  project_name: "fact-checking-bert"
  report_to: ["wandb"]
  logging_dir: "src/experiments/logs"

# Class Weights (for imbalanced datasets)
class_weights:
  enabled: true
  method: "balanced"  # or "custom"

# Visualization Configuration
visualization:
  save_plots: true
  plot_format: "png"
  dpi: 300
  figure_size: [8, 6] 